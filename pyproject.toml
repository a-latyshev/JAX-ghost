[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxghost"
version = "0.1.0"
description = "DOLFINx owner-to-ghost updates on JAX arrays using mpi4jax"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.6.0",
    "mpi4jax==0.9.1.post1",
    "mpi4py>=3.0.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
